<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>· 个人作品集 ·</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        /* 全局重置与变量 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f9fafc;
            --surface: #ffffff;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;
            --border-light: #e5e7eb;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
            --shadow-sm: 0 10px 25px -5px rgba(0, 0, 0, 0.03), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 20px 30px -10px rgba(0, 0, 0, 0.05), 0 8px 15px -8px rgba(0, 0, 0, 0.03);
            --radius-lg: 32px;
            --radius-md: 20px;
            --radius-sm: 12px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 主容器 */
        .site-wrapper {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
        }

        /* 导航区域 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2.5rem;
            border-bottom: 1px solid var(--border-light);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 2px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.2s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.2s ease;
            border-radius: 2px;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* 主体内容 */
        .main-content {
            padding: 2.5rem 2.5rem 3rem;
        }

        /* 页脚 */
        .footer {
            padding: 1.5rem 2.5rem;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--accent);
        }

        /* 响应式调整 */
        @media (max-width: 700px) {
            body {
                padding: 1rem;
            }

            .navbar {
                padding: 1rem 1.5rem;
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1.5rem;
            }

            .main-content {
                padding: 2rem 1.5rem;
            }

            .footer {
                flex-direction: column;
                align-items: flex-start;
                padding: 1.5rem;
            }
        }

        /* 平滑滚动 */
        html {
            scroll-behavior: smooth;
        }

        /* 焦点样式 (无障碍) */
        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <!-- 导航栏 -->
        <nav class="navbar">
            <a href="#" class="logo">
                <span></span> 你的名字
            </a>
            <div class="nav-links">
                <!-- 在这里添加导航链接，例如： -->
                <!-- <a href="#home">首页</a> -->
            </div>
        </nav>

        <!-- 主要内容（在这里添加你的区块） -->
        <main class="main-content">
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <div>© 2025 你的名字</div>
            <div>
                <a href="#">回到顶部 ↑</a>
            </div>
        </footer>
    </div>
</body>
</html>
